name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Start dev server
        run: |
          bun run dev &
          echo $! > /tmp/dev.pid
          # Wait for the server to accept connections (max ~60s).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/ -o /dev/null || (echo "Server failed to start" && exit 1)

      - name: Run API tests
        run: bash scripts/test-api.sh

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" || true
          fi
