name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI. Bump deliberately.
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: build
    env:
      # Local SQLite DB for the test run. Provisioned below.
      DATABASE_URL: file:./prisma/ci.db
      NEXORA_MASTER_KEY: test-master-key-for-ci-only-not-real
      NEXORA_WEBHOOK_SECRET: test-webhook-secret-for-ci-only-not-real
      NEXTAUTH_SECRET: test-nextauth-secret-for-ci-only-not-real
      NEXORA_SANDBOX_KEY: test-sandbox-key-for-ci-only-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push schema to test DB
        run: bun run db:push

      - name: Seed demo data
        run: bun run scripts/seed.ts

      - name: Start dev server (no log tee)
        run: |
          # Don't use `bun run dev` because that pipes through `tee`,
          # which makes `$!` the PID of tee, not next. Redirect instead.
          bun x next dev -p 3000 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/ -o /dev/null || (echo "Server failed to start"; cat /tmp/dev.log; exit 1)

      - name: Run API tests
        run: bash scripts/test-api.sh

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" || true
          fi
