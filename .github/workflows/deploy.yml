name: Deploy

# Runs after the CI workflow on the same ref succeeds.
# To run on tags, both `workflow_run` and the `tags: ["v*"]` trigger
# would need to be set; for now, deploy only fires on main pushes with a
# green CI run behind it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only one deploy per ref at a time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # Only deploy when the CI workflow succeeded. Skips on cancelled/failure.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The workflow_run event checks out the default branch; ref is
          # the SHA that triggered the original CI run.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: this is a placeholder workflow — the actual registry login
      # and push steps are stubbed below. Fill in REGISTRY, IMAGE_NAME,
      # and the repository secrets (DOCKER_USERNAME / DOCKER_PASSWORD or
      # a registry token) before enabling in production.

      - name: Echo build steps (placeholder)
        run: |
          set -x
          echo "Would build image: \${REGISTRY}/\${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          echo "Would run: docker buildx build --platform linux/amd64,linux/arm64 -t \${REGISTRY}/\${IMAGE_NAME}:${{ steps.meta.outputs.tag }} --push ."
          echo "Would also tag :latest on main pushes."

      # Uncomment and configure once registry credentials are available:
