name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

# Only one deploy per ref at a time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # Gated: only deploy after the CI workflow on the same ref succeeds.
    # (For tags we trust the tag, but still want a green build.)
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: this is a placeholder workflow — the actual registry login
      # and push steps are stubbed below. Fill in REGISTRY, IMAGE_NAME,
      # and the repository secrets (DOCKER_USERNAME / DOCKER_PASSWORD or
      # a registry token) before enabling in production.

      - name: Echo build steps (placeholder)
        run: |
          set -x
          echo "Would build image: \${REGISTRY}/\${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          echo "Would run: docker buildx build --platform linux/amd64,linux/arm64 -t \${REGISTRY}/\${IMAGE_NAME}:${{ steps.meta.outputs.tag }} --push ."
          echo "Would also tag :latest on main pushes."

      # Uncomment and configure once registry credentials are available:
